<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSD Anime — PSDループアニメツール</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>PSD Anime</h1>

      <section class="panel">
        <label class="filebtn">
          PSDを読み込む
          <input type="file" id="file" accept=".psd" />
        </label>
        <p class="hint">画面にPSDをドラッグ&amp;ドロップでもOK</p>
        <button id="sampleBtn">サンプルPSDを開く</button>
        <p id="docinfo" class="hint"></p>
      </section>

      <section class="panel">
        <h2>設定の保持</h2>
        <div class="row">
          <label class="inline"><input type="checkbox" id="autoSave" checked /> 自動保存する</label>
        </div>
        <p class="hint">同じPSDを開き直すと、前回のレイヤー設定を復元します。</p>
        <div class="btnrow">
          <button id="exportBtn" title="現在の設定をJSONで書き出します">書き出し</button>
          <label class="btn" title="設定JSONを読み込みます">読み込み<input type="file" id="importFile" accept=".json" /></label>
          <button id="resetSettings" title="このPSDの保存済み設定を消して初期状態に戻します">リセット</button>
        </div>
        <p id="saveinfo" class="hint"></p>
      </section>

      <section class="panel">
        <h2>Live2D 書き出し</h2>
        <div class="row">
          <label>フレームレート</label>
          <select id="l2dFps">
            <option value="15">15 fps</option>
            <option value="24">24 fps</option>
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </div>
        <div class="btnrow">
          <button id="l2dExport">書き出し（3ファイル）</button>
          <button id="l2dGuide">手順書を開く</button>
        </div>
        <p class="hint">
          Cubism 3/4/5 のモーション形式（公開仕様）で書き出します。読み込み後もキーフレームを編集できます。
        </p>
        <p id="l2dinfo" class="hint"></p>
        <p id="l2dlinks" class="hint"></p>
      </section>

      <section class="panel">
        <h2>全体設定</h2>
        <div class="row">
          <label>ループ長 (秒)</label>
          <input type="number" id="loopDuration" min="0.5" max="60" step="0.5" value="4" />
        </div>
        <div class="row">
          <label>レイヤー間隔 (奥行)</label>
          <input type="range" id="depthStep" min="0" max="1" step="0.01" value="0.15" />
          <output id="depthStepOut">0.15</output>
        </div>
        <div class="row">
          <label>カメラ</label>
          <select id="cameraMode">
            <option value="persp">パース (3D感あり)</option>
            <option value="ortho">平行投影 (2D)</option>
          </select>
        </div>
        <div class="row">
          <label>視野角</label>
          <input type="range" id="fov" min="10" max="80" step="1" value="35" />
          <output id="fovOut">35</output>
        </div>
        <div class="row">
          <label>背景</label>
          <input type="color" id="bgColor" value="#101014" />
          <label class="inline"><input type="checkbox" id="bgTransparent" /> 透明</label>
        </div>
        <div class="row">
          <label class="inline"><input type="checkbox" id="showGrid" /> グリッド表示</label>
        </div>
        <h3>全体モーション</h3>
        <div class="row">
          <label>プリセット</label>
          <select id="globalPreset">
            <option value="none">なし</option>
            <option value="spinY">Y軸まわり回転</option>
            <option value="spinZ">Z軸まわり回転</option>
            <option value="tilt3d">3Dゆらぎ (首振り)</option>
            <option value="swing">振り子 (Z揺れ)</option>
            <option value="sway">左右スライド</option>
            <option value="bob">上下ふわふわ</option>
            <option value="orbit">円運動</option>
            <option value="pulse">拡大縮小</option>
            <option value="blink">点滅 (オン/オフ)</option>
            <option value="fade">明滅 (なめらか)</option>
            <option value="flicker">ちらつき (不規則)</option>
          </select>
        </div>
        <div class="row">
          <label>強さ</label>
          <input type="range" id="globalAmp" min="0" max="2" step="0.01" value="0.5" />
          <output id="globalAmpOut">0.50</output>
        </div>
        <div class="row">
          <label>周期数</label>
          <input type="number" id="globalCycles" min="1" max="8" step="1" value="1" />
        </div>
        <div class="row">
          <label>ランダム度</label>
          <input type="range" id="globalRnd" min="0" max="1" step="0.01" value="0" />
          <output id="globalRndOut">0.00</output>
        </div>
        <div class="row">
          <label>シード</label>
          <input type="number" id="globalSeed" min="1" max="999" step="1" value="1" />
        </div>
      </section>

      <section class="panel">
        <h2>レイヤー <span id="layerCount" class="badge">0</span></h2>
        <p class="hint">各レイヤーに個別のループモーションを設定できます。</p>
        <div id="layers"></div>
      </section>
    </aside>

    <main id="stage">
      <div id="viewport"></div>
      <div id="toolbar">
        <button id="playBtn">⏸ 一時停止</button>
        <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" />
        <span id="timeLabel">0.00s</span>
        <button id="resetCam">カメラリセット</button>
        <button id="recBtn">🎬 1ループ録画 (webm)</button>
      </div>
      <div id="drop">ここにPSDをドロップ</div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
